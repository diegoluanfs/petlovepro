<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetLovePro — Prévia de integração comercial</title>
<style>:root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#f6f1fc;color:#321466}header{background:#321466;color:#fff;padding:36px max(20px,calc((100% - 1100px)/2))}header h1{font-size:36px;margin:4px 0}header b{color:#ffa840}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.hint{padding:15px 20px;background:#fff3d9;border-left:4px solid #ffa840;border-radius:10px;color:#65430f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}.item{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 20px #32146612;display:flex;flex-direction:column;gap:12px;min-height:220px}.item h2{font-size:18px;margin:0}.tag{color:#704b9a;font-size:12px;font-weight:700}.price{font-weight:800;font-size:23px;margin-top:auto}.button{background:#4e2096;color:white;border:0;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;text-align:center}.button:disabled{background:#e7e2ed;color:#71667a;cursor:not-allowed}.controls{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center}input{font:inherit;border:1px solid #d0c4e1;border-radius:12px;padding:12px;width:min(400px,100%)}small{color:#665b70}#notice{min-height:24px}</style>
</head><body><header><h1>petlove<b>pro</b></h1><p>Prévia técnica da sincronização entre catálogo e Kiwify</p></header><main class="wrap"><div class="hint"><strong>Prévia local, sem compra real.</strong> O catálogo abaixo é gerado a partir da auditoria. A publicação e o checkout ainda dependem da integração com o repositório PetLovePro e o Firebase.</div><div class="controls"><h2>Catálogo de 60 produtos</h2><input id="search" placeholder="Buscar por título ou coleção" aria-label="Buscar produto"></div><p id="notice" role="status"></p><div class="grid" id="grid"></div></main>
<script src="../dist/catalog-commerce.js"></script><script>
const data=window.PetLoveProCommerceCatalog.items;
const grid=document.querySelector('#grid'),status=document.querySelector('#notice');
function render(){const filter=document.querySelector('#search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();grid.replaceChildren();for(const p of data){const label=(p.title+' '+p.id).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(!label.includes(filter))continue;
 const card=document.createElement('article');card.className='item';const tag=document.createElement('span');tag.className='tag';tag.textContent=p.kind==='collection'?'COLEÇÃO · 5 E-BOOKS':'LIVRO DIGITAL';
 const title=document.createElement('h2');title.textContent=p.title;const price=document.createElement('div');price.className='price';price.textContent=p.live?(p.price/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'Em breve';
 const btn=document.createElement('button');btn.className='button';btn.textContent=p.live?'Comprar na Kiwify':'Em breve';btn.disabled=!p.live;
 btn.addEventListener('click',()=>{status.textContent=`${p.title}: o checkout será validado pelo Firebase antes do redirecionamento. Esta prévia não cobra nem redireciona.`;});
 card.append(tag,title,price,btn);grid.append(card);
}}document.querySelector('#search').addEventListener('input',render);render();
</script></body></html>
